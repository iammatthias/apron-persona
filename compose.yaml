# Runs on the farfield homelab; deploy with `ff-deploy apron-persona`.
# Secrets live in .env next to this file on the box, never in git.
name: apron-persona
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Caddy reaches the page at host.docker.internal; bind there only.
      - "172.17.0.1:8902:8080"   # public status page
      - "172.17.0.1:8903:8081"   # moderation; private add-site only
    volumes:
      - ./data:/data
